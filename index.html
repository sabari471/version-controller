<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Image Carousel</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    perspective: 1200px;
    font-family: Arial, sans-serif;
  }

  .carousel {
    width: 400px;
    height: 300px;
    position: relative;
    transform-style: preserve-3d;
    animation: rotate 30s infinite linear;
  }

  .carousel img {
    position: absolute;
    width: 300px;
    height: 200px;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
    transform-origin: center center -500px;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }

  @keyframes rotate {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
</style>
</head>
<body>

<div class="carousel">
  <img src="https://picsum.photos/300/200?random=1" style="transform: rotateY(0deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=2" style="transform: rotateY(30deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=3" style="transform: rotateY(60deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=4" style="transform: rotateY(90deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=5" style="transform: rotateY(120deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=6" style="transform: rotateY(150deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=7" style="transform: rotateY(180deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=8" style="transform: rotateY(210deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=9" style="transform: rotateY(240deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=10" style="transform: rotateY(270deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=11" style="transform: rotateY(300deg) translateZ(500px);">
  <img src="https://picsum.photos/300/200?random=12" style="transform: rotateY(330deg) translateZ(500px);">
</div>
  <div class="btn">
    <a href="/home.html"> next version</a>
  </div>
</body>
</html>
