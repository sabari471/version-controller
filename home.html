<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Image Carousel</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(120deg, #1a1a1a, #2b2b2b);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  h1 {
    margin-bottom: 50px;
    font-size: 2.5rem;
    text-align: center;
    letter-spacing: 2px;
    color: #ffcc00;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
  }

  .carousel-container {
    width: 500px;
    height: 350px;
    perspective: 1500px;
  }

  .carousel {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s ease;
    animation: rotate 20s infinite linear;
  }

  .carousel:hover {
    animation-play-state: paused;
  }

  .carousel img {
    position: absolute;
    width: 350px;
    height: 220px;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
    transform-origin: center center -600px;
    border-radius: 15px;
    box-shadow: 0 15px 25px rgba(0,0,0,0.6);
    transition: transform 0.5s, box-shadow 0.5s;
  }

  .carousel img:hover {
    transform: translateZ(100px);
    box-shadow: 0 25px 35px rgba(0,0,0,0.8);
    cursor: pointer;
  }

  @keyframes rotate {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
</style>
</head>
<body>

<h1>Our 3D Image Carousel</h1>

<div class="carousel-container">
  <div class="carousel">
    <img src="https://picsum.photos/350/220?random=1" style="transform: rotateY(0deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=2" style="transform: rotateY(30deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=3" style="transform: rotateY(60deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=4" style="transform: rotateY(90deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=5" style="transform: rotateY(120deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=6" style="transform: rotateY(150deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=7" style="transform: rotateY(180deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=8" style="transform: rotateY(210deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=9" style="transform: rotateY(240deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=10" style="transform: rotateY(270deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=11" style="transform: rotateY(300deg) translateZ(600px);">
    <img src="https://picsum.photos/350/220?random=12" style="transform: rotateY(330deg) translateZ(600px);">
  </div>
</div>

</body>
</html>
